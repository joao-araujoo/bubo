services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    volumes:
      - bubo-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bubo-internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - bubo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - bubo-internal

  backend:
    image: bubo-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: ${SERVICE_NAME:-bubo-api}
      APP_RELEASE: ${APP_RELEASE:-development}
      INSTANCE_COUNT: ${INSTANCE_COUNT:-1}
      MONGODB_URI: mongodb://mongo:27017/bubo
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-50}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-5}
      MONGO_MAX_IDLE_TIME_MS: ${MONGO_MAX_IDLE_TIME_MS:-60000}
      MONGO_SERVER_SELECTION_TIMEOUT_MS: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:-10000}
      MONGO_SOCKET_TIMEOUT_MS: ${MONGO_SOCKET_TIMEOUT_MS:-45000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-bubo:production}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1500}
      REDIS_CACHE_TTL_MS: ${REDIS_CACHE_TTL_MS:-3600000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CLIENT_URL: http://localhost:${BUBO_PORT:-8080}
      TRUST_PROXY: "true"
      BODY_LIMIT: 1mb
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
      BOOK_SEARCH_RATE_LIMIT: ${BOOK_SEARCH_RATE_LIMIT:-60}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ERROR_REPORTING_URL: ${ERROR_REPORTING_URL:-}
      ERROR_REPORTING_TOKEN: ${ERROR_REPORTING_TOKEN:-}
      ERROR_REPORTING_TIMEOUT_MS: ${ERROR_REPORTING_TIMEOUT_MS:-3000}
      BOOK_SEARCH_CACHE_TTL_MS: ${BOOK_SEARCH_CACHE_TTL_MS:-21600000}
      BOOK_SEARCH_MEMORY_CACHE_TTL_MS: ${BOOK_SEARCH_MEMORY_CACHE_TTL_MS:-900000}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    networks:
      - bubo-internal

  frontend:
    image: bubo-frontend:local
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BUBO_PORT:-8080}:80"
    networks:
      - bubo-internal

  seed:
    image: bubo-backend:local
    profiles: ["demo"]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/bubo
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@bubo.local}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?SEED_DEMO_PASSWORD is required for the demo seed}
      SEED_RESET_PASSWORD: ${SEED_RESET_PASSWORD:-false}
    command: ["npm", "run", "seed"]
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bubo-internal

volumes:
  bubo-mongo-data:
  bubo-redis-data:

networks:
  bubo-internal:
    driver: bridge
