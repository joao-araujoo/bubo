services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    volumes:
      - bubo-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bubo-internal

  backend:
    image: bubo-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/bubo
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-12345}
      CLIENT_URL: http://localhost:${BUBO_PORT:-8080}
      TRUST_PROXY: "true"
      BODY_LIMIT: 1mb
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    networks:
      - bubo-internal

  frontend:
    image: bubo-frontend:local
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BUBO_PORT:-8080}:80"
    networks:
      - bubo-internal

  seed:
    image: bubo-backend:local
    profiles: ["demo"]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/bubo
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-12345}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@bubo.local}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-BuboDemo123!}
      SEED_RESET_PASSWORD: ${SEED_RESET_PASSWORD:-false}
    command: ["npm", "run", "seed"]
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bubo-internal

volumes:
  bubo-mongo-data:

networks:
  bubo-internal:
    driver: bridge
