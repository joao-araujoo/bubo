<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bubo — Feche o livro.</title>
    <style>
      html,
      body {
        margin: 0;
        background: #140d1f;
        overflow: hidden;
      }
      #film {
        display: block;
      }
      body:not(.render) #film {
        height: calc(100vh - 56px);
        width: auto;
        margin: 0 auto;
      }
      #ui {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 56px;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 16px;
        color: #f4eeff;
        font: 600 14px system-ui;
      }
      #ui[hidden] {
        display: none;
      }
      #range {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="film"></canvas>
    <div id="ui" hidden>
      <input id="range" type="range" min="0" step="0.001" />
      <span id="time"></span>
      <span>space = play · ←/→ = frame</span>
    </div>
    <script>
      if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
