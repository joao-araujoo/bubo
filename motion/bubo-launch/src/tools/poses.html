<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Bubo poses</title>
    <style>
      body {
        margin: 0;
        background: #f8f5ff;
        font: 600 18px system-ui;
        color: #21152f;
      }
      main {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
        padding: 12px;
      }
      figure {
        margin: 0;
        background: #fff;
        border-radius: 16px;
        text-align: center;
        padding: 6px;
        position: relative;
      }
      img {
        width: 100%;
        display: block;
      }
      .box {
        position: absolute;
        border: 1px dashed #ef5b5b;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main id="grid"></main>
    <script type="module">
      const poses = [
        'main',
        'neutral',
        'happy',
        'celebrating',
        'curious',
        'thinking',
        'surprised',
        'focused',
        'reading',
        'sleeping',
        'cheering',
        'worried',
        'confident',
        'taking-notes',
        'idea',
        'doubt',
        'typing',
        'welcome',
        'achievement',
        'deep-reading',
        'review',
        'loading',
        'empty',
        'error',
      ];
      const grid = document.getElementById('grid');
      const report = {};
      await Promise.all(
        poses.map(async (pose) => {
          const img = new Image();
          img.src = `../../build/assets/mascot/bubo-${pose}.png`;
          await img.decode();
          const c = new OffscreenCanvas(img.width, img.height);
          const g = c.getContext('2d');
          g.drawImage(img, 0, 0);
          const d = g.getImageData(0, 0, img.width, img.height).data;
          let x0 = img.width,
            y0 = img.height,
            x1 = 0,
            y1 = 0;
          for (let y = 0; y < img.height; y += 2)
            for (let x = 0; x < img.width; x += 2)
              if (d[(y * img.width + x) * 4 + 3] > 24) {
                if (x < x0) x0 = x;
                if (x > x1) x1 = x;
                if (y < y0) y0 = y;
                if (y > y1) y1 = y;
              }
          report[pose] = { x0, y0, x1, y1, w: img.width, h: img.height };
        }),
      );
      for (const pose of poses) {
        const fig = document.createElement('figure');
        const img = new Image();
        img.src = `../../build/assets/mascot/bubo-${pose}.png`;
        fig.append(img);
        const cap = document.createElement('figcaption');
        const r = report[pose];
        cap.textContent = `${pose} ${r.x0},${r.y0}-${r.x1},${r.y1}`;
        fig.append(cap);
        grid.append(fig);
      }
      window.poseReport = report;
      window.ready = true;
    </script>
  </body>
</html>
