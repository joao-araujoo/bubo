name: Observability

on:
  pull_request:
    paths:
      - 'backend/src/app.js'
      - 'backend/src/server.js'
      - 'backend/src/config/env.js'
      - 'backend/src/middleware/auth.js'
      - 'backend/src/middleware/observability.js'
      - 'backend/src/observability/**'
      - 'backend/src/utils/logger.js'
      - 'backend/test/*observability*.test.js'
      - 'backend/test/environment.test.js'
      - 'backend/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/observability.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/src/app.js'
      - 'backend/src/server.js'
      - 'backend/src/config/env.js'
      - 'backend/src/middleware/auth.js'
      - 'backend/src/middleware/observability.js'
      - 'backend/src/observability/**'
      - 'backend/src/utils/logger.js'
      - 'backend/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/observability.yml'

permissions:
  contents: read

jobs:
  observability:
    name: Runtime observability journey
    runs-on: ubuntu-latest
    env:
      BUBO_PORT: 8080
      API_PORT: 3001
      SERVICE_NAME: bubo-api-ci
      APP_RELEASE: ${{ github.sha }}
      METRICS_ENABLED: 'true'
      AI_PROVIDER: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral credentials
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "METRICS_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production stack
        run: docker compose build backend frontend

      - name: Start Bubo
        run: docker compose up -d mongo backend frontend

      - name: Wait for readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health/ready >/tmp/readiness.json 2>/dev/null; then
              jq -e '.status == "ok" and .ready == true and .checks.database == "connected"' /tmp/readiness.json
              exit 0
            fi
            sleep 2
          done
          echo "Bubo did not become ready in time."
          exit 1

      - name: Verify liveness and request correlation
        shell: bash
        run: |
          curl -fsS \
            -D /tmp/live-headers.txt \
            -H 'x-request-id: observability-ci-request' \
            http://localhost:3001/api/health/live \
            | jq -e '.status == "ok" and .requestId == "observability-ci-request"'
          grep -qi '^x-request-id: observability-ci-request' /tmp/live-headers.txt

      - name: Reject unauthenticated metrics
        shell: bash
        run: |
          STATUS=$(curl -sS -o /tmp/metrics-unauthorized.json -w '%{http_code}' http://localhost:3001/api/metrics)
          test "$STATUS" = "401"
          jq -e '.code == "METRICS_UNAUTHORIZED" and (.requestId | length) > 0' /tmp/metrics-unauthorized.json

      - name: Verify protected metrics
        shell: bash
        run: |
          curl -sS \
            -H 'x-request-id: metrics-404-request' \
            http://localhost:3001/api/not-real >/tmp/not-found.json
          jq -e '.code == "ENDPOINT_NOT_FOUND" and .requestId == "metrics-404-request"' /tmp/not-found.json

          curl -fsS \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            http://localhost:3001/api/metrics \
            | jq -e \
              --arg release "$APP_RELEASE" \
              '.service == "bubo-api-ci" and .release == $release and .database == "connected" and .http.totalRequests >= 4 and .http.statusClasses["4xx"] >= 2 and .process.memoryMb.rss > 0 and .process.eventLoopDelayMs.p99 >= 0'

      - name: Verify compatibility health through frontend
        shell: bash
        run: |
          curl -fsS http://localhost:8080/api/health \
            | jq -e '.status == "ok" and .ready == true'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
