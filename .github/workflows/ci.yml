name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        id: frontend-build
        continue-on-error: true
        shell: bash
        run: npm run build > build.log 2>&1

      - name: Report build failure
        if: steps.frontend-build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('frontend/build.log', 'utf8');
            const lines = output.trim().split('\n').slice(-60).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- bubo-ci-build-error -->\n## Frontend build failed\n\n\`\`\`text\n${lines}\n\`\`\``
            });

      - name: Enforce frontend build
        if: steps.frontend-build.outcome == 'failure'
        run: exit 1

  backend:
    name: Backend module check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Load application modules
        run: node -e "require('./src/app'); console.log('Backend modules loaded successfully')"
