name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Enforce UI policy
        id: frontend-policy
        continue-on-error: true
        shell: bash
        run: npm run check:ui-policy > policy.log 2>&1

      - name: Lint source code
        id: frontend-lint
        continue-on-error: true
        shell: bash
        run: npm run lint > lint.log 2>&1

      - name: Run automated tests
        id: frontend-test
        continue-on-error: true
        shell: bash
        run: npm run test > test.log 2>&1

      - name: Build application
        id: frontend-build
        continue-on-error: true
        shell: bash
        run: npm run build > build.log 2>&1

      - name: Report quality gate failure
        if: >-
          github.event_name == 'pull_request' &&
          (steps.frontend-policy.outcome == 'failure' ||
           steps.frontend-lint.outcome == 'failure' ||
           steps.frontend-test.outcome == 'failure' ||
           steps.frontend-build.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          POLICY_OUTCOME: ${{ steps.frontend-policy.outcome }}
          LINT_OUTCOME: ${{ steps.frontend-lint.outcome }}
          TEST_OUTCOME: ${{ steps.frontend-test.outcome }}
          BUILD_OUTCOME: ${{ steps.frontend-build.outcome }}
        with:
          script: |
            const fs = require('fs');

            const checks = [
              ['UI policy', process.env.POLICY_OUTCOME, 'frontend/policy.log'],
              ['Lint', process.env.LINT_OUTCOME, 'frontend/lint.log'],
              ['Tests', process.env.TEST_OUTCOME, 'frontend/test.log'],
              ['Build', process.env.BUILD_OUTCOME, 'frontend/build.log'],
            ];

            const sections = checks
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name, , path]) => {
                const output = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Log unavailable.';
                const lines = output.trim().split('\n').slice(-80).join('\n');
                return `### ${name}\n\n\`\`\`text\n${lines}\n\`\`\``;
              });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- bubo-ci-quality-error -->\n## Frontend quality gate failed\n\n${sections.join('\n\n')}`,
            });

      - name: Enforce frontend quality gate
        if: >-
          steps.frontend-policy.outcome == 'failure' ||
          steps.frontend-lint.outcome == 'failure' ||
          steps.frontend-test.outcome == 'failure' ||
          steps.frontend-build.outcome == 'failure'
        run: exit 1

  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        id: backend-test
        continue-on-error: true
        shell: bash
        run: npm test > test.log 2>&1

      - name: Load application modules
        id: backend-modules
        continue-on-error: true
        shell: bash
        run: node -e "require('./src/app'); console.log('Backend modules loaded successfully')" > modules.log 2>&1

      - name: Report backend quality failure
        if: >-
          github.event_name == 'pull_request' &&
          (steps.backend-test.outcome == 'failure' ||
           steps.backend-modules.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.backend-test.outcome }}
          MODULE_OUTCOME: ${{ steps.backend-modules.outcome }}
        with:
          script: |
            const fs = require('fs');

            const checks = [
              ['Tests', process.env.TEST_OUTCOME, 'backend/test.log'],
              ['Module loading', process.env.MODULE_OUTCOME, 'backend/modules.log'],
            ];

            const sections = checks
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name, , path]) => {
                const output = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Log unavailable.';
                const lines = output.trim().split('\n').slice(-80).join('\n');
                return `### ${name}\n\n\`\`\`text\n${lines}\n\`\`\``;
              });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- bubo-ci-backend-error -->\n## Backend quality gate failed\n\n${sections.join('\n\n')}`,
            });

      - name: Enforce backend quality gate
        if: >-
          steps.backend-test.outcome == 'failure' ||
          steps.backend-modules.outcome == 'failure'
        run: exit 1

  clone-ready:
    name: Clone-ready smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      BUBO_PORT: 8080
      API_PORT: 3001
      AI_PROVIDER: auto
      SEED_DEMO_EMAIL: demo@bubo.local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral smoke-test credentials
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SEED_DEMO_PASSWORD=$(openssl rand -base64 30 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production images
        run: docker compose build backend frontend

      - name: Start database, API and frontend
        run: docker compose up -d mongo backend frontend

      - name: Wait for the complete stack
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "Bubo stack is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Bubo stack did not become healthy in time."
          exit 1

      - name: Seed demonstration data
        run: docker compose --profile demo run --rm seed

      - name: Authenticate demo account and verify protected API
        shell: bash
        run: |
          LOGIN_PAYLOAD=$(jq -n \
            --arg email "$SEED_DEMO_EMAIL" \
            --arg password "$SEED_DEMO_PASSWORD" \
            '{email: $email, password: $password}')
          LOGIN_RESPONSE=$(curl -fsS \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "$LOGIN_PAYLOAD" \
            http://localhost:8080/api/auth/login)
          TOKEN=$(printf '%s' "$LOGIN_RESPONSE" | jq -r '.token')
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "SMOKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/auth/profile \
            | jq -e '.user.email == "demo@bubo.local" and .user.onboardingCompleted == true'

      - name: Verify complete reading lifecycle
        shell: bash
        run: |
          BOOK_PAYLOAD=$(jq -n \
            --arg canonicalId "smoke:${GITHUB_RUN_ID}" \
            '{
              canonicalId: $canonicalId,
              title: "Livro de teste do acervo",
              author: "Bubo CI",
              status: "to-read",
              totalPages: 240,
              pagesSource: "manual",
              metadataSources: ["manual"]
            }')
          CREATE_RESPONSE=$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$BOOK_PAYLOAD" \
            http://localhost:8080/api/books/library)
          USER_BOOK_ID=$(printf '%s' "$CREATE_RESPONSE" | jq -r '.userBook._id')
          test -n "$USER_BOOK_ID"
          test "$USER_BOOK_ID" != "null"
          printf '%s' "$CREATE_RESPONSE" | jq -e '.userBook.status == "to-read" and .userBook.totalPagesOverride == 240'

          UPDATE_RESPONSE=$(curl -fsS \
            -X PATCH \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"status":"reading","currentPage":12,"totalPages":240}' \
            "http://localhost:8080/api/books/library/$USER_BOOK_ID")
          printf '%s' "$UPDATE_RESPONSE" | jq -e '.userBook.status == "reading" and .userBook.currentPage == 12 and .userBook.totalPagesOverride == 240'

          SESSION_RESPONSE=$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"pageFrom":13,"pageTo":28,"durationMinutes":35,"focus":"high","note":"Sessão de validação do CI","readAt":"2026-07-10T00:00:00.000Z"}' \
            "http://localhost:8080/api/books/library/$USER_BOOK_ID/sessions")
          SESSION_ID=$(printf '%s' "$SESSION_RESPONSE" | jq -r '.session._id')
          test -n "$SESSION_ID"
          test "$SESSION_ID" != "null"
          printf '%s' "$SESSION_RESPONSE" | jq -e '.session.pagesRead == 16 and .session.durationMinutes == 35 and .userBook.status == "reading" and .userBook.currentPage == 28'

          DETAIL_RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            "http://localhost:8080/api/books/library/$USER_BOOK_ID")
          printf '%s' "$DETAIL_RESPONSE" | jq -e --arg sessionId "$SESSION_ID" '.userBook.currentPage == 28 and .summary.sessionCount == 1 and .summary.pagesReadInSessions == 16 and .summary.durationMinutes == 35 and (.sessions | any(._id == $sessionId and .pageFrom == 13 and .pageTo == 28))'

          curl -fsS \
            -X DELETE \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            "http://localhost:8080/api/books/library/$USER_BOOK_ID/sessions/$SESSION_ID"

          curl -fsS \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            "http://localhost:8080/api/books/library/$USER_BOOK_ID" \
            | jq -e '.userBook.currentPage == 28 and .summary.sessionCount == 0 and (.sessions | length) == 0'

          curl -fsS \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            http://localhost:8080/api/books/library \
            | jq -e --arg id "$USER_BOOK_ID" '.userBooks | any(._id == $id and .status == "reading" and .currentPage == 28)'

          curl -fsS \
            -X DELETE \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            "http://localhost:8080/api/books/library/$USER_BOOK_ID"

          curl -fsS \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            http://localhost:8080/api/books/library \
            | jq -e --arg id "$USER_BOOK_ID" '.userBooks | all(._id != $id)'

      - name: Verify concurrent health and protected reads
        shell: bash
        run: |
          seq 1 40 | xargs -P 10 -I{} curl -fsS http://localhost:8080/api/health >/dev/null
          seq 1 40 | xargs -P 10 -I{} curl -fsS \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            http://localhost:8080/api/books/library >/dev/null

      - name: Verify frontend document and API health
        shell: bash
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root"></div>'
          curl -fsS http://localhost:8080/api/health | jq -e '.status == "ok" and .database == "connected"'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop smoke-test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
