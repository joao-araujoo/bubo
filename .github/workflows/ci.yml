name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint source code
        id: frontend-lint
        continue-on-error: true
        shell: bash
        run: npm run lint > lint.log 2>&1

      - name: Run automated tests
        id: frontend-test
        continue-on-error: true
        shell: bash
        run: npm run test > test.log 2>&1

      - name: Build application
        id: frontend-build
        continue-on-error: true
        shell: bash
        run: npm run build > build.log 2>&1

      - name: Report quality gate failure
        if: >-
          github.event_name == 'pull_request' &&
          (steps.frontend-lint.outcome == 'failure' ||
           steps.frontend-test.outcome == 'failure' ||
           steps.frontend-build.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          LINT_OUTCOME: ${{ steps.frontend-lint.outcome }}
          TEST_OUTCOME: ${{ steps.frontend-test.outcome }}
          BUILD_OUTCOME: ${{ steps.frontend-build.outcome }}
        with:
          script: |
            const fs = require('fs');

            const checks = [
              ['Lint', process.env.LINT_OUTCOME, 'frontend/lint.log'],
              ['Tests', process.env.TEST_OUTCOME, 'frontend/test.log'],
              ['Build', process.env.BUILD_OUTCOME, 'frontend/build.log'],
            ];

            const sections = checks
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name, , path]) => {
                const output = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Log unavailable.';
                const lines = output.trim().split('\n').slice(-80).join('\n');
                return `### ${name}\n\n\`\`\`text\n${lines}\n\`\`\``;
              });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- bubo-ci-quality-error -->\n## Frontend quality gate failed\n\n${sections.join('\n\n')}`,
            });

      - name: Enforce frontend quality gate
        if: >-
          steps.frontend-lint.outcome == 'failure' ||
          steps.frontend-test.outcome == 'failure' ||
          steps.frontend-build.outcome == 'failure'
        run: exit 1

  backend:
    name: Backend module check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Load application modules
        run: node -e "require('./src/app'); console.log('Backend modules loaded successfully')"
