name: Apply draft CI policy

on:
  pull_request:
    paths:
      - '.github/workflows/draft-ci-policy.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/observability.yml'
      - '.github/workflows/club-journey.yml'

permissions:
  contents: write

jobs:
  apply-policy:
    name: Apply draft guard
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add draft guards to pull request workflows
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('.github/workflows/ci.yml'),
              Path('.github/workflows/observability.yml'),
              Path('.github/workflows/club-journey.yml'),
          ]
          guard = "    if: github.event_name == 'push' || github.event.pull_request.draft == false"

          for path in paths:
              content = path.read_text(encoding='utf-8')
              lines = content.splitlines()
              updated = []

              for index, line in enumerate(lines):
                  updated.append(line)
                  if line.startswith('    runs-on:'):
                      following = lines[index + 1] if index + 1 < len(lines) else ''
                      if following.strip().startswith('if:'):
                          continue
                      updated.append(guard)

              path.write_text('\n'.join(updated) + '\n', encoding='utf-8')

      - name: Commit workflow policy
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/ci.yml .github/workflows/observability.yml .github/workflows/club-journey.yml; then
            echo "Draft guards are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/observability.yml .github/workflows/club-journey.yml
          git commit -m "ci: skip expensive gates on draft pull requests"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
