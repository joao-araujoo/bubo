name: Backend test diagnostic

on:
  push:
    branches:
      - agent/bubo-2-reading-clubs

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bubo-2-reading-clubs
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Capture test output
        id: backend-test
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: npm test > backend-test.log 2>&1

      - name: Comment diagnostic on PR
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.backend-test.outcome }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('backend/backend-test.log', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `<!-- bubo-backend-diagnostic -->\n## Backend test diagnostic — ${process.env.TEST_OUTCOME}\n\n\`\`\`text\n${output.slice(-12000)}\n\`\`\``,
            });

      - name: Remove temporary diagnostic workflow
        shell: bash
        run: |
          git config user.name "bubo-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/backend-debug.yml
          git commit -m "Remove temporary backend diagnostic workflow"
          git push origin HEAD:agent/bubo-2-reading-clubs
