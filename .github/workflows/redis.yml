name: Redis

on:
  pull_request:
    paths:
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/scripts/verify-redis*.js'
      - 'backend/src/app.js'
      - 'backend/src/server.js'
      - 'backend/src/config/env.js'
      - 'backend/src/infrastructure/redis/**'
      - 'backend/src/observability/**'
      - 'backend/src/services/books/bookSearchCache.js'
      - 'backend/src/utils/logger.js'
      - 'backend/test/**'
      - 'docker-compose.yml'
      - '.github/workflows/redis.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/scripts/verify-redis*.js'
      - 'backend/src/app.js'
      - 'backend/src/server.js'
      - 'backend/src/config/env.js'
      - 'backend/src/infrastructure/redis/**'
      - 'backend/src/observability/**'
      - 'backend/src/services/books/bookSearchCache.js'
      - 'backend/src/utils/logger.js'
      - 'backend/test/**'
      - 'docker-compose.yml'
      - '.github/workflows/redis.yml'
  workflow_dispatch:

concurrency:
  group: redis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  redis:
    name: Shared Redis journey
    runs-on: ubuntu-latest
    env:
      BUBO_PORT: 8080
      API_PORT: 3001
      SERVICE_NAME: bubo-api-redis-ci
      APP_RELEASE: ${{ github.sha }}
      INSTANCE_COUNT: 2
      REDIS_REQUIRED: 'true'
      REDIS_KEY_PREFIX: bubo:redis-ci:${{ github.run_id }}
      METRICS_ENABLED: 'true'
      AI_PROVIDER: auto
      SEED_DEMO_EMAIL: demo@bubo.local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral credentials
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "METRICS_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SEED_DEMO_PASSWORD=$(openssl rand -base64 30 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production stack
        run: docker compose build backend frontend

      - name: Start Bubo with Redis
        run: docker compose up -d mongo redis backend frontend

      - name: Wait for shared readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health/ready >/tmp/readiness.json 2>/dev/null; then
              jq -e '
                .status == "ok" and
                .ready == true and
                .database == "connected" and
                .redis == "connected" and
                .dependencies.redis.enabled == true and
                .dependencies.redis.required == true and
                .dependencies.redis.ready == true
              ' /tmp/readiness.json
              exit 0
            fi
            sleep 2
          done
          echo "Bubo did not become ready with Redis in time."
          exit 1

      - name: Verify Redis remains private
        shell: bash
        run: |
          REDIS_CONTAINER=$(docker compose ps -q redis)
          test -n "$REDIS_CONTAINER"
          docker inspect "$REDIS_CONTAINER" \
            | jq -e '.[0].HostConfig.PortBindings == null or ((.[0].HostConfig.PortBindings // {}) | length == 0)'

      - name: Verify cache, TTL and shared store behavior
        run: docker compose exec -T backend npm run verify:redis

      - name: Verify counters across independent processes
        shell: bash
        run: |
          VERIFICATION_ID="process-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          FIRST=$(docker compose exec -T \
            -e REDIS_VERIFICATION_ID="$VERIFICATION_ID" \
            -e REDIS_VERIFICATION_MODE=increment \
            backend npm run verify:redis:counter | tail -n 1)
          printf '%s' "$FIRST" | jq -e '.status == "ok" and .totalHits == 1'

          SECOND=$(docker compose run --rm -T \
            -e REDIS_VERIFICATION_ID="$VERIFICATION_ID" \
            -e REDIS_VERIFICATION_MODE=increment \
            backend npm run verify:redis:counter | tail -n 1)
          printf '%s' "$SECOND" | jq -e '.status == "ok" and .totalHits == 2'

          READ_BACK=$(docker compose run --rm -T \
            -e REDIS_VERIFICATION_ID="$VERIFICATION_ID" \
            -e REDIS_VERIFICATION_MODE=read \
            backend npm run verify:redis:counter | tail -n 1)
          printf '%s' "$READ_BACK" | jq -e '.status == "ok" and .totalHits == 2'

          docker compose exec -T \
            -e REDIS_VERIFICATION_ID="$VERIFICATION_ID" \
            -e REDIS_VERIFICATION_MODE=reset \
            backend npm run verify:redis:counter | tail -n 1 \
            | jq -e '.status == "ok" and .totalHits == 0'

      - name: Verify protected Redis metrics
        shell: bash
        run: |
          STATUS=$(curl -sS -o /tmp/metrics-unauthorized.json -w '%{http_code}' http://localhost:3001/api/metrics)
          test "$STATUS" = "401"
          jq -e '.code == "METRICS_UNAUTHORIZED"' /tmp/metrics-unauthorized.json

          curl -fsS \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            http://localhost:3001/api/metrics >/tmp/metrics.json
          jq -e \
            --arg release "$APP_RELEASE" \
            '.service == "bubo-api-redis-ci" and
             .release == $release and
             .database == "connected" and
             .redis.enabled == true and
             .redis.required == true and
             .redis.ready == true and
             .redis.commands > 0 and
             .redis.failures >= 0 and
             .redis.target.host == "redis"' \
            /tmp/metrics.json

      - name: Verify required Redis outage and recovery
        shell: bash
        run: |
          docker compose stop redis

          for attempt in $(seq 1 30); do
            STATUS=$(curl -sS -o /tmp/degraded.json -w '%{http_code}' http://localhost:3001/api/health/ready || true)
            if [ "$STATUS" = "503" ] && jq -e '.ready == false and .redis == "degraded" and .dependencies.redis.required == true' /tmp/degraded.json >/dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Readiness did not become unavailable after Redis stopped."
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://localhost:3001/api/health/live \
            | jq -e '.status == "ok"'

          docker compose start redis

          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health/ready >/tmp/recovered.json 2>/dev/null; then
              if jq -e '.ready == true and .redis == "connected" and .dependencies.redis.ready == true' /tmp/recovered.json >/dev/null; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Backend did not recover after Redis restarted."
          exit 1

      - name: Verify frontend compatibility
        shell: bash
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root"></div>'
          curl -fsS http://localhost:8080/api/health \
            | jq -e '.status == "ok" and .database == "connected" and .redis == "connected"'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true
