name: Backend diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/backend-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    name: Capture backend test log
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Capture backend tests
        id: tests
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          STATUS=$?
          cat test.log
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Upload backend diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostic-${{ github.run_id }}
          path: backend/test.log
          if-no-files-found: error
          retention-days: 1
