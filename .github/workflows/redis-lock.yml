name: Redis dependency lock

on:
  pull_request:
    paths:
      - 'backend/package.json'
      - '.github/workflows/redis-lock.yml'

permissions:
  contents: write

jobs:
  generate-lock:
    name: Generate backend package lock
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Generate package lock
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean install
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lock
        shell: bash
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Package lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "build(redis): refresh backend dependency lock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
